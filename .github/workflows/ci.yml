name: Beaver-Auth CI/CD Pipeline

on:
  push:
    branches: [Main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [Main, master]

permissions:
  contents: read
  id-token: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup pnpm and node.js
        uses: pnpm/setup@v1
        with:
          runtime: node@24
          install: true
          cache: true

      - name: Run tests (Vitest)
        run: pnpm -r test

      - name: Build core package only
        run: pnpm --filter @beaver-auth/core run build

  publish:
    needs: test-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup pnpm and node.js
        uses: pnpm/setup@v1
        with:
          runtime: node@24
          install: true
          cache: true

      - name: Build Core Package Only
        run: pnpm --filter @beaver-auth/core run build

      - name: Authenticate with npm
        env:
          NPM_TOKEN: ${{ secrets.BEAVER_AUTH_NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "Error: BEAVER_AUTH_NPM_TOKEN is not set or empty"; exit 1
          fi
          # We use pnpm config commands directly. This securely saves the registry and token perfectly.
          pnpm config set registry https://registry.npmjs.org/
          pnpm config set //registry.npmjs.org/:_authToken="${NPM_TOKEN}"

      - name: Verify npm auth
        run: |
          pnpm whoami || (echo "Authentication verification failed — check BEAVER_AUTH_NPM_TOKEN value and permissions on npmjs.com"; exit 1)

      - name: Dry-run publish
        run: pnpm --filter @beaver-auth/core publish --dry-run --no-git-checks --access public

      - name: Publish Core Package Only
        run: pnpm --filter @beaver-auth/core publish --no-git-checks --access public
