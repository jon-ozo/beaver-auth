name: Beaver-Auth CI/CD Pipeline

on:
  push:
    branches: [Main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [Main, master]

permissions:
  contents: read
  id-token: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup pnpm and node.js
        uses: pnpm/setup@v1
        with:
          runtime: node@24
          install: true
          cache: true

      - name: Run tests (Vitest)
        run: pnpm -r test

      - name: Build core package only
        run: pnpm --filter @beaver-auth/core run build

  publish:
    needs: test-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup pnpm and node.js
        uses: pnpm/setup@v1
        with:
          runtime: node@24
          install: true
          cache: true

      - name: Build Core Package Only
        run: pnpm --filter @beaver-auth/core run build

      - name: Publish Core Package using OIDC
        run: |
          cd packages/core 
          npm publish --provenance --access public
